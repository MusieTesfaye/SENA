[package]
name = "sena-prover"
description = "Production Groth16 Prover Service and ZK parameter ceremony runner for SENA Keyless accounts."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
sena-primitives = { path = "../sena-primitives" }
sena-stf = { path = "../sena-stf" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true
rand.workspace = true
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
sha2.workspace = true
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
ark-bn254 = "0.6.0"
ark-groth16 = "0.6.0"
ark-serialize = "0.6.0"
ark-ff = "0.6.0"
ark-ec = "0.6.0"

[dev-dependencies]
sena-params.workspace = true

[[bin]]
name = "sena-prover"
path = "src/bin/sena_prover.rs"

[lints]
workspace = true
