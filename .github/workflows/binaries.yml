name: Binaries

# Builds sena-node for Windows, macOS and Linux, so the wallet
# (github.com/MusieTesfaye/wallet) can be tried without a Rust toolchain.
#
# Before uploading, each build runs the wallet's own devnet on its OS:
# `bun run devnet` with this sena-node, a faucet request, and a check that
# the coins arrived on chain. Download from the run's "Artifacts".

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/binaries.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, exe: .exe }
          - { name: macos-arm64, os: macos-latest, exe: "" }
          - { name: linux-x64, os: ubuntu-latest, exe: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p sena-node

      - name: Check out the wallet
        uses: actions/checkout@v4
        with:
          repository: MusieTesfaye/wallet
          path: wallet
      - uses: oven-sh/setup-bun@v2
      - name: Run the wallet's devnet and use its faucet
        shell: bash
        run: |
          cd wallet
          bun install
          SENA_NODE="$GITHUB_WORKSPACE/target/release/sena-node${{ matrix.exe }}" bun run devnet --fresh > devnet.log 2>&1 &
          rpc() { curl -s -X POST -H 'Content-Type: application/json' -d "$1" http://127.0.0.1:8545; }
          for i in $(seq 1 60); do rpc '{"method":"sena_getChainInfo"}' | grep -q sena-wallet-devnet-1 && break; sleep 1; done
          for i in $(seq 1 30); do curl -s http://127.0.0.1:3001/ | grep -q faucet && break; sleep 1; done
          cat devnet.log
          rpc '{"method":"sena_getFeeAssets"}' | grep -q '"symbol":"EURC"'
          ADDR=0x$(printf 'ab%.0s' $(seq 1 32))
          curl -s -X POST -H 'Content-Type: application/json' -d "{\"address\":\"$ADDR\",\"asset\":2}" http://127.0.0.1:3001/faucet | tee faucet.json
          grep -q '"hash"' faucet.json
          for i in $(seq 1 20); do rpc "{\"method\":\"sena_getAccount\",\"params\":{\"address\":\"$ADDR\"}}" | grep -q '"amount":"100000000"' && ok=1 && break; sleep 1; done
          test "$ok" = 1 && echo "faucet payment of 100.00 USDT confirmed on chain"

      - name: Upload sena-node
        uses: actions/upload-artifact@v4
        with:
          name: sena-node-${{ matrix.name }}
          path: target/release/sena-node${{ matrix.exe }}
          if-no-files-found: error
