[package]
name = "sena"
version = "0.1.0"
authors = ["SENA Network contributors"]
license = "Apache-2.0"

[addresses]
sena = "_"

# Pinned to a commit rather than a branch.
#
# `rev = "mainnet"` is a moving target: the framework it resolves to changes
# under the package, and a build that cannot be reproduced cannot be the basis
# for a deployed package hash (BETA_BUILD_PLAN.md W-02).
#
# This commit is the tree tagged `aptos-cli-v9.6.0`, chosen so the framework and
# the CLI that compiles it come from the same revision -- see move/README.md.
[dependencies.AptosFramework]
git = "https://github.com/aptos-labs/aptos-core.git"
rev = "07490157d3250932a385010878a3c5ae7c1338bb"
subdir = "aptos-move/framework/aptos-framework"
